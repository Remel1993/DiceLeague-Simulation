<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="careerSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="52%" stop-color="#06281e"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <radialGradient id="pitchSpot" cx="50%" cy="55%" r="52%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#059669" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="careerTurf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#careerSky)"/>
  <rect width="1600" height="900" fill="url(#pitchSpot)"/>

  <!-- Distant Stadium Horizon -->
  <path d="M0 430 Q800 320 1600 430 L1600 540 L0 540 Z" fill="#061614" opacity="0.9"/>
  <path d="M0 450 Q800 345 1600 450" stroke="#34d399" stroke-opacity="0.25" stroke-width="2" fill="none"/>

  <!-- Grass Pitch -->
  <polygon points="0,535 1600,535 1600,900 0,900" fill="url(#careerTurf)"/>
  <g opacity="0.18" fill="#34d399">
    <polygon points="80,535 260,535 60,900 -140,900"/>
    <polygon points="440,535 620,535 500,900 280,900"/>
    <polygon points="800,535 980,535 980,900 760,900"/>
    <polygon points="1160,535 1340,535 1460,900 1240,900"/>
  </g>

  <!-- Goalpost Silhouette & Net -->
  <g stroke="#e2e8f0" stroke-opacity="0.45" fill="none">
    <polyline points="560,545 560,395 1040,395 1040,545" stroke-width="8" stroke-linejoin="round"/>
    <polyline points="560,395 595,420 1005,420 1040,395" stroke-width="3" stroke-opacity="0.25"/>
    <line x1="595" y1="420" x2="595" y2="545" stroke-width="2" stroke-opacity="0.2"/>
    <line x1="1005" y1="420" x2="1005" y2="545" stroke-width="2" stroke-opacity="0.2"/>
  </g>

  <!-- Penalty Box Lines -->
  <polygon points="340,545 1260,545 1460,820 140,820" stroke="#ffffff" stroke-opacity="0.32" stroke-width="3" fill="none"/>
  <circle cx="800" cy="675" r="6" fill="#ffffff" fill-opacity="0.45"/>
</svg>
