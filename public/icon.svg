<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="120" y1="80" x2="392" y2="432" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="140" y1="90" x2="372" y2="410" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="176" y1="176" x2="336" y2="336" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed dark stadium background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>

  <!-- Subtle pitch glow -->
  <circle cx="256" cy="256" r="190" fill="#1e3a8a" fill-opacity="0.18"/>

  <!-- Outer Shield -->
  <path d="M256 68L404 120V256C404 348 340 412 256 444C172 412 108 348 108 256V120L256 68Z"
        fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="14" stroke-linejoin="round"/>

  <!-- Inner Shield Accent -->
  <path d="M256 96L378 139V252C378 329 326 382 256 410C186 382 134 329 134 252V139L256 96Z"
        stroke="#38bdf8" stroke-opacity="0.25" stroke-width="4" stroke-linejoin="round"/>

  <!-- Central Die (Football Simulation) -->
  <rect x="176" y="172" width="160" height="160" rx="34" fill="#f8fafc" stroke="url(#goldGrad)" stroke-width="8"/>

  <!-- 5-pip layout styled like football / dice -->
  <circle cx="216" cy="212" r="14" fill="#0f172a"/>
  <circle cx="296" cy="212" r="14" fill="#0f172a"/>
  <circle cx="256" cy="252" r="18" fill="url(#emeraldGrad)"/>
  <circle cx="216" cy="292" r="14" fill="#0f172a"/>
  <circle cx="296" cy="292" r="14" fill="#0f172a"/>

  <!-- Top Star Badge -->
  <path d="M256 114L265 133L286 136L271 150L275 171L256 161L237 171L241 150L226 136L247 133L256 114Z"
        fill="url(#goldGrad)"/>
</svg>
