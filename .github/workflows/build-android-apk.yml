name: Build Android APK (Offline)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Android SDK 36 & Accept Licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=$(command -v sdkmanager || find "$SDK_DIR" -name sdkmanager -type f 2>/dev/null | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_DIR"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "Using sdkmanager: $SDKMANAGER"
          (yes || true) | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses >/dev/null 2>&1 || true
          (yes || true) | "$SDKMANAGER" --sdk_root="$SDK_DIR" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install Web Dependencies & Build Offline Bundle
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi
          npm run build

      - name: Install Capacitor CLI & Android Platform
        run: npm install --no-save @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets

      - name: Prepare App Icons for Android
        run: |
          mkdir -p assets
          cp public/pwa-512x512.png assets/icon-only.png
          cp public/pwa-maskable-512x512.png assets/icon-foreground.png
          node -e "require('sharp')({create:{width:512,height:512,channels:4,background:'#030b1c'}}).png().toFile('assets/icon-background.png')" || cp public/pwa-512x512.png assets/icon-background.png
          cp public/pwa-512x512.png assets/splash.png
          cp public/pwa-512x512.png assets/splash-dark.png

      - name: Generate Android Native Project & Bundle Assets
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx capacitor-assets generate --android || true
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Artifact
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/DiceFootball.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiceFootball-Android-APK
          path: release-apk/DiceFootball.apk
          retention-days: 30
